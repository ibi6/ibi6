<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全实力展示</title>
<style>
  body{margin:0;background:#0b0b0f;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .wrap{width:min(960px,94vw);padding:24px}

</head>
<body>
  <div class="wrap">
    <h1>全实力展示</h1>
    <video controls autoplay muted playsinline preload="auto">
      <source src="showcase.mp4" type="video/mp4">
      请用下方链接下载后播放。
    </video>
    <div class="links">
      <a href="showcase.mp4" download>下载 MP4</a>
    </div>
    <p>若自动播放没声，点一下画面取消静音即可。</p>
  </div>
</body>
</html>
